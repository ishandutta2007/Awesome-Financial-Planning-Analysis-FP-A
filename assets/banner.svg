<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 900 240"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#060c18"/><stop offset="50%" stop-color="#0c1628"/><stop offset="100%" stop-color="#050a14"/></linearGradient><linearGradient id="emeraldGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="50%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#34d399"/><stop offset="50%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#818cf8"/></linearGradient><linearGradient id="scanGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#10b981" stop-opacity="0"/><stop offset="50%" stop-color="#10b981" stop-opacity=".8"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></linearGradient><linearGradient id="barGrad1" x1="0%" x2="0%" y1="100%" y2="0%"><stop offset="0%" stop-color="#064e3b" stop-opacity=".7"/><stop offset="100%" stop-color="#10b981" stop-opacity=".95"/></linearGradient><linearGradient id="barGrad2" x1="0%" x2="0%" y1="100%" y2="0%"><stop offset="0%" stop-color="#1e3a8a" stop-opacity=".7"/><stop offset="100%" stop-color="#38bdf8" stop-opacity=".95"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="hubGlow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="10"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="fpaGrid" width="30" height="30" patternUnits="userSpaceOnUse"><path fill="none" stroke="#38bdf8" stroke-opacity=".1" stroke-width=".5" d="M 30 0 L 0 0 0 30"/><circle cx="0" cy="0" r="1" fill="#10b981" fill-opacity=".25"/></pattern><style>@keyframes pulseGlow{0%{filter:drop-shadow(0 0 10px rgba(16,185,129,.5));opacity:.9}50%{filter:drop-shadow(0 0 20px rgba(56,189,248,.85));opacity:1}}@keyframes radarSweep{0%{transform:rotate(0deg)}}@keyframes scanLine{0%{transform:translateY(0);opacity:.2}50%{opacity:.8}}@keyframes circuitDash{0%{stroke-dashoffset:200}}@keyframes floatNode{0%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes beaconRing{0%{r:10px;opacity:.8;stroke-width:2px}}@keyframes barGrow1{0%{height:45px;y:65px}50%{height:60px;y:50px}}@keyframes barGrow2{0%{height:65px;y:45px}50%{height:80px;y:30px}}@keyframes barGrow3{0%{height:85px;y:25px}50%{height:95px;y:15px}}.pulse-hub{animation:pulseGlow 4s infinite ease-in-out}.scanner{animation:scanLine 5s infinite linear}.circuit-line{stroke-dasharray:8,8;animation:circuitDash 8s infinite linear}.radar-sweep{transform-origin:120px 120px;animation:radarSweep 8s infinite linear}.floating-node-1{animation:floatNode 3.5s infinite ease-in-out}.floating-node-2{animation:floatNode 4.5s infinite ease-in-out 1s}.beacon{animation:beaconRing 2.5s infinite cubic-bezier(.2,.8,.4,1)}.bar-anim-1{animation:barGrow1 4.5s ease-in-out infinite}.bar-anim-2{animation:barGrow2 5.5s ease-in-out infinite}.bar-anim-3{animation:barGrow3 4s ease-in-out infinite}.sub-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif}.title-text{font-weight:800}.sub-text{font-weight:500}</style></defs><rect width="900" height="240" fill="url(#bgGrad)" rx="16"/><rect width="900" height="240" fill="url(#fpaGrid)" rx="16"/><rect width="900" height="2" x="0" y="0" fill="url(#scanGrad)" class="scanner" opacity=".6"/><path fill="none" stroke="#10b981" stroke-width="1.5" d="M 120 120 L 210 120 L 240 80 L 320 80" class="circuit-line" opacity=".4"/><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M 120 120 L 195 170 L 300 170" class="circuit-line" opacity=".4"/><path fill="none" stroke="#10b981" stroke-width="1.5" d="M 860 60 L 790 60 L 760 95 L 700 95" class="circuit-line" opacity=".3"/><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M 870 185 L 810 185 L 780 150 L 710 150" class="circuit-line" opacity=".3"/><g transform="translate(15, 0)"><circle cx="120" cy="120" r="85" fill="none" stroke="#10b981" stroke-dasharray="4 4" stroke-opacity=".15" stroke-width="1"/><circle cx="120" cy="120" r="60" fill="none" stroke="#38bdf8" stroke-opacity=".25" stroke-width="1"/><circle cx="120" cy="120" r="35" fill="none" stroke="#818cf8" stroke-opacity=".3" stroke-width="1"/><circle cx="120" cy="120" r="10" fill="none" stroke="#10b981" class="beacon"/><g class="radar-sweep"><path fill="url(#emeraldGrad)" d="M 120 120 L 205 120 A 85 85 0 0 0 120 35 Z" opacity=".12"/><line x1="120" x2="205" y1="120" y2="120" stroke="#10b981" stroke-width="1.5" opacity=".6"/></g><g class="pulse-hub"><path fill="url(#emeraldGrad)" d="M 23 2 L 6 10 C 6 23 13 33 23 38 C 33 33 40 23 40 10 L 23 2 Z" filter="url(#hubGlow)" opacity=".95" transform="translate(88, 85) scale(1.4)"/><path fill="#060c18" d="M 23 5 L 9 12 C 9 22 15 30 23 34.5 C 31 30 37 22 37 12 L 23 5 Z" opacity=".8" transform="translate(88, 85) scale(1.4)"/><path fill="none" stroke="#34d399" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M 15 25 L 20 19 L 24 22 L 31 13 M 27 13 L 31 13 L 31 17" transform="translate(88, 85) scale(1.4)"/></g></g><g><g class="floating-node-1" transform="translate(255, 0) translate(0, 32)"><rect width="230" height="24" x="0" y="0" fill="#064e3b" stroke="#10b981" stroke-width="1" opacity=".9" rx="12"/><circle cx="12" cy="12" r="4" fill="#34d399"/><text x="24" y="16" fill="#a7f3d0" class="sub-text" font-size="11" letter-spacing="1">ENTERPRISE FP&amp;A ECOSYSTEM</text></g><text x="0" y="98" fill="url(#textGrad)" class="title-text" font-size="31" letter-spacing=".5" transform="translate(255, 0)">Awesome FP&amp;A Software</text><text x="0" y="132" fill="#f1f5f9" class="sub-text" font-si