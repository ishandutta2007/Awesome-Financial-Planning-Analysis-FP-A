<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;overflow:hidden;">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Gradient Accents -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="0.8" stroke-opacity="0.4" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }

      /* Subtle CSS Animation Waves & Pulse */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatChart {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -200; }
      }
      @keyframes barGrow1 {
        0%, 100% { height: 90px; y: 200px; }
        50% { height: 115px; y: 175px; }
      }
      @keyframes barGrow2 {
        0%, 100% { height: 130px; y: 160px; }
        50% { height: 155px; y: 135px; }
      }
      @keyframes barGrow3 {
        0%, 100% { height: 180px; y: 110px; }
        50% { height: 210px; y: 80px; }
      }
      @keyframes barGrow4 {
        0%, 100% { height: 140px; y: 150px; }
        50% { height: 120px; y: 170px; }
      }
      @keyframes pillFloat1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes pillFloat2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(5px); }
      }

      .pulse-orb {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: 950px 140px;
      }
      .moving-chart {
        animation: floatChart 7s ease-in-out infinite;
      }
      .chart-line {
        stroke-dasharray: 6 4;
        animation: dashAnim 15s linear infinite;
      }
      .bar-1 { animation: barGrow1 5s ease-in-out infinite; }
      .bar-2 { animation: barGrow2 6s ease-in-out infinite; }
      .bar-3 { animation: barGrow3 4.5s ease-in-out infinite; }
      .bar-4 { animation: barGrow4 7s ease-in-out infinite; }
      .pill-1 { animation: pillFloat1 4s ease-in-out infinite; }
      .pill-2 { animation: pillFloat2 4.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGradient)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <circle class="pulse-orb" cx="960" cy="150" r="140" fill="#10b981" filter="blur(70px)" opacity="0.3" />
  <circle class="pulse-orb" cx="1100" cy="240" r="120" fill="#3b82f6" filter="blur(65px)" opacity="0.25" />
  <circle cx="200" cy="80" r="100" fill="#06b6d4" filter="blur(75px)" opacity="0.15" />

  <!-- DYNAMIC BACKGROUND FP&A METRIC VISUALIZATIONS (Right Side) -->
  <g class="moving-chart" opacity="0.85">
    <!-- Graph Background Grid Plate -->
    <rect x="760" y="60" width="390" height="240" rx="14" fill="#0f172a" fill-opacity="0.75" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Mini Metric Header in Card -->
    <text x="785" y="92" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">BUDGET VS ACTUAL VARIANCE</text>
    <text x="1090" y="93" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">+18.4% ▲</text>
    <line x1="785" y1="104" x2="1120" y2="104" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Dynamic Animated Chart Bars -->
    <rect class="bar-1" x="805" y="200" width="28" height="90" rx="4" fill="url(#barGrad1)" />
    <rect class="bar-2" x="855" y="160" width="28" height="130" rx="4" fill="url(#barGrad2)" />
    <rect class="bar-4" x="905" y="150" width="28" height="140" rx="4" fill="url(#barGrad1)" />
    <rect class="bar-3" x="955" y="110" width="28" height="180" rx="4" fill="url(#barGrad2)" />
    <rect class="bar-2" x="1005" y="140" width="28" height="150" rx="4" fill="url(#barGrad1)" />
    <rect class="bar-3" x="1055" y="95" width="28" height="195" rx="4" fill="url(#emeraldGrad)" />

    <!-- Trend Line / Forecast Projection Curve -->
    <path class="chart-line" d="M 819 195 Q 869 150 919 140 T 1019 110 T 1070 85" fill="none" stroke="#38bdf8" stroke-width="3" />
    <circle cx="1070" cy="85" r="5" fill="#38bdf8">
      <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Dynamic Floating Decorative Tags/Pills (Stay cleanly on the right, non-overlapping) -->
  <g class="pill-1">
    <rect x="740" y="38" width="135" height="30" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
    <circle cx="755" cy="53" r="4" fill="#10b981" />
    <text x="768" y="58" fill="#e2e8f0" class="badge-text">📊 Rolling Forecast</text>
  </g>

  <g class="pill-2">
    <rect x="1010" y="285" width="150" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="1025" cy="301" r="4" fill="#38bdf8" />
    <text x="1038" y="306" fill="#e2e8f0" class="badge-text">⚡ Driver Modeling</text>
  </g>

  <!-- PRIMARY TITLE AND SUBTITLE (FOREGROUND - Crisp, clear, left-aligned) -->
  <g transform="translate(60, 0)">
    <!-- Category Mini-Kicker -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="235" height="28" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
      <text x="12" y="19" fill="#10b981" class="badge-text" letter-spacing="1">ENTERPRISE EPM &amp; FP&amp;A ECOSYSTEM</text>
    </g>

    <!-- Main Title (Gradient Foreground Accent) -->
    <text class="title-text" x="0" y="160" font-size="44" fill="#ffffff">
      Awesome <tspan fill="url(#emeraldGrad)">FP&amp;A</tspan> Software
    </text>

    <!-- Subtitle -->
    <text class="sub-text" x="0" y="202" font-size="20" fill="#cbd5e1">
      Financial Planning &amp; Analysis • CPM / EPM • Driver-Based Modeling
    </text>

    <!-- Sub-bullet Features -->
    <text class="sub-text" x="0" y="238" font-size="14.5" fill="#94a3b8">
      Curated directory of SaaS category leaders, modern spreadsheet engines,
    </text>
    <text class="sub-text" x="0" y="260" font-size="14.5" fill="#94a3b8">
      and open-source Python, Excel, and AI-native budgeting &amp; variance tools.
    </text>

    <!-- Bottom Highlights / Tags -->
    <g transform="translate(0, 288)">
      <rect x="0" y="0" width="125" height="26" rx="5" fill="#1e293b" />
      <text x="14" y="17" fill="#64748b" class="badge-text">📈 Budgeting</text>

      <rect x="135" y="0" width="135" height="26" rx="5" fill="#1e293b" />
      <text x="149" y="17" fill="#64748b" class="badge-text">🔮 Forecasting</text>

      <rect x="280" y="0" width="165" height="26" rx="5" fill="#1e293b" />
      <text x="294" y="17" fill="#64748b" class="badge-text">⚖️ Variance Analysis</text>

      <rect x="455" y="0" width="150" height="26" rx="5" fill="#1e293b" />
      <text x="469" y="17" fill="#64748b" class="badge-text">📋 Board Reports</text>
    </g>
  </g>

  <!-- Subtle Bottom Edge Highlight Line -->
  <rect x="0" y="357" width="1200" height="3" fill="url(#emeraldGrad)" />
</svg>
